name: OpenBLAS clang/LLVM OpenMP repro

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  clang-llvm-openmp:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            miniforge_arch: Linux-aarch64
            target_args: TARGET=ARMV8
            expect_fail: "1"

          - name: linux-x86_64
            runner: ubuntu-24.04
            miniforge_arch: Linux-x86_64
            target_args: ""
            expect_fail: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show machine info
        run: |
          set -eux
          uname -a
          uname -m
          lscpu
          nproc

      - name: Install Miniforge
        run: |
          set -eux

          curl -L -o miniforge.sh \
            "https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-${{ matrix.miniforge_arch }}.sh"

          bash miniforge.sh -b -p "$HOME/miniforge3"

          source "$HOME/miniforge3/etc/profile.d/conda.sh"
          conda config --set always_yes yes
          conda config --set channel_priority strict
          conda update -n base -c conda-forge conda

      - name: Create clang/LLVM OpenMP environment
        run: |
          set -eux

          source "$HOME/miniforge3/etc/profile.d/conda.sh"

          conda create -n oblas-clang -c conda-forge \
            git make clang clangxx llvm-openmp binutils

          conda activate oblas-clang

          which clang
          which clang++
          clang --version
          clang++ --version

          conda list | grep -E 'llvm-openmp|openmp|clang|binutils' || true

      - name: Build clean OpenBLAS with clang/LLVM OpenMP
        run: |
          set -eux

          source "$HOME/miniforge3/etc/profile.d/conda.sh"
          conda activate oblas-clang

          git clone --branch v0.3.33 --depth 1 \
            https://github.com/OpenMathLib/OpenBLAS.git OpenBLAS-0.3.33-clang

          cd OpenBLAS-0.3.33-clang

          make -j"$(nproc)" \
            CC="$CONDA_PREFIX/bin/clang" \
            USE_OPENMP=1 \
            NO_AFFINITY=1 \
            NUM_THREADS=128 \
            NO_LAPACK=1 \
            NOFORTRAN=1 \
            ${{ matrix.target_args }}

          make PREFIX="$PWD/install-openmp-clang-clean" install

          echo "=== OpenMP symbols in OpenBLAS archive ==="
          nm -u "$PWD/install-openmp-clang-clean/lib/libopenblas.a" \
            | grep -E 'GOMP|__kmpc|omp_' \
            | sort -u \
            | head -100 || true

      - name: Compile reproducer
        run: |
          set -eux

          source "$HOME/miniforge3/etc/profile.d/conda.sh"
          conda activate oblas-clang

          LIB_CLANG_CLEAN="$GITHUB_WORKSPACE/OpenBLAS-0.3.33-clang/install-openmp-clang-clean/lib/libopenblas.a"

          clang -O2 -Wall -Wextra \
            "$GITHUB_WORKSPACE/openblas_dsyr2k_dgemm_minimal_repro.c" \
            "$LIB_CLANG_CLEAN" \
            -L"$CONDA_PREFIX/lib" \
            -Wl,-rpath,"$CONDA_PREFIX/lib" \
            -lomp -lpthread -lm -ldl \
            -o repro_clang_llvm_omp

      - name: Check linkage and symbols
        run: |
          set -eux

          echo "=== ldd ==="
          ldd ./repro_clang_llvm_omp || true

          echo "=== OpenMP-related undefined symbols in final executable ==="
          nm -u ./repro_clang_llvm_omp \
            | grep -E 'GOMP|__kmpc|omp_' \
            | sort -u || true

      - name: Run controls and threaded stress attempts
        run: |
          set +e

          EXPECT_FAIL="${{ matrix.expect_fail }}"

          echo "=== mutex control: OMP_NUM_THREADS=8, use_mutex=1 ==="
          OMP_NUM_THREADS=8 ./repro_clang_llvm_omp 1
          status_mutex=$?

          echo "=== single-thread control: OMP_NUM_THREADS=1, no mutex ==="
          OMP_NUM_THREADS=1 ./repro_clang_llvm_omp 0
          status_single=$?

          if [ "$status_mutex" -ne 0 ]; then
            echo "Mutex control failed."
            exit 1
          fi

          if [ "$status_single" -ne 0 ]; then
            echo "Single-thread control failed."
            exit 1
          fi

          echo "=== threaded no-mutex stress attempts ==="
          fail_seen=0

          for i in $(seq 1 20); do
            echo "=== attempt $i: default geometry, calls=500 ==="
            OMP_NUM_THREADS=8 ./repro_clang_llvm_omp 0 32 32 64 64 128 500
            status=$?

            if [ "$status" -ne 0 ]; then
              echo "Observed failure on attempt $i."
              fail_seen=1
              break
            fi
          done

          echo "fail_seen=$fail_seen expected_fail=$EXPECT_FAIL"

          if [ "$EXPECT_FAIL" = "1" ]; then
            if [ "$fail_seen" -eq 0 ]; then
              echo "Expected at least one threaded no-mutex failure on ARM64, but all attempts passed."
              exit 1
            fi
            echo "Observed expected ARM64 pattern: threaded no-mutex can fail; mutex and single-thread controls pass."
          else
            if [ "$fail_seen" -ne 0 ]; then
              echo "Unexpected threaded no-mutex failure on x86_64."
              exit 1
            fi
            echo "Observed expected x86_64 pattern: threaded no-mutex and controls pass."
          fi

      - name: Run threshold controls
        run: |
          set -eux

          echo "=== DSYR2K below threshold control: syr_n=31, syr_k=32 ==="
          OMP_NUM_THREADS=8 ./repro_clang_llvm_omp 0 31 32 64 64 128 500

          echo "=== DGEMM below threshold control: K=127 ==="
          OMP_NUM_THREADS=8 ./repro_clang_llvm_omp 0 32 32 64 64 127 500

      - name: Run larger-size diagnostic
        run: |
          set +e

          EXPECT_FAIL="${{ matrix.expect_fail }}"

          echo "=== larger-size threaded no-mutex diagnostic ==="
          OMP_NUM_THREADS=8 ./repro_clang_llvm_omp 0 64 64 128 128 128 1000
          status_large=$?

          echo "larger-size status: $status_large expected_fail=$EXPECT_FAIL"

          if [ "$EXPECT_FAIL" = "0" ] && [ "$status_large" -ne 0 ]; then
            echo "Larger-size diagnostic failed on x86_64."
            exit 1
          fi

          if [ "$EXPECT_FAIL" = "1" ] && [ "$status_large" -ne 0 ]; then
            echo "Larger-size diagnostic also failed on ARM64."
          fi

          if [ "$EXPECT_FAIL" = "1" ] && [ "$status_large" -eq 0 ]; then
            echo "Larger-size diagnostic passed on ARM64. This is not fatal because the repeated default stress attempts are the decisive check."
          fi

          exit 0